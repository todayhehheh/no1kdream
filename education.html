        }
        .nav-content {
            width: 100%; max-width: 1200px; /* 폭을 넓힘 */
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo-text {
            font-size: 18px; font-weight: 800; color: var(--primary);

        }
        .page-title { font-size: 16px; font-weight: 600; color: #636E72; }

        /* 2. 메인 컨텐츠 영역 */
        .container {
            max-width: 1200px; /* [수정] 4열 배치를 위해 폭을 1200px로 넓힘 */

        .hero-text {
            text-align: center; margin-bottom: 40px;
        }
        .hero-text h2 { font-size: 24px; margin: 0 0 10px 0; color: var(--text-main); }
        .hero-text p { font-size: 15px; color: #95A5A6; margin: 0; }

        /* 3. 비디오 그리드 (카드형) - [수정됨] */
        .video-grid {
            display: grid;
            gap: 25px;
            margin-bottom: 40px;
            /* 기본(모바일): 자동 반응형 */
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        /* [중요] PC 화면(1024px 이상)에서는 무조건 4열(한 줄에 4개) 강제 고정 */
        @media (min-width: 1024px) {
            .video-grid {
                grid-template-columns: repeat(4, 1fr) !important;
            }
        }

            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            border: 1px solid transparent;
        }

            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(108, 92, 231, 0.15);
            border-color: rgba(108, 92, 231, 0.3);
        }

        .thumbnail-wrap {
            width: 100%; aspect-ratio: 16/9;
            background-size: cover; background-position: center;
            position: relative;
            background-color: #eee;
        }
        .thumbnail-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .video-card:hover .thumbnail-overlay { background: rgba(0,0,0,0.3); }

        .play-icon {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transform: scale(0.9); transition: 0.3s; opacity: 0.9;
        }
        .video-card:hover .play-icon { transform: scale(1.1); opacity: 1; }

        .card-body { padding: 18px; }
        .video-title {
            font-size: 16px; font-weight: 700; line-height: 1.4;
            color: #2d3436; margin: 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;

        .video-meta {
            margin-top: 8px; font-size: 13px; color: #b2bec3; font-weight: 500;

        /* 4. 페이지네이션 */
        .pagination { display: flex; justify-content: center; gap: 12px; margin-bottom: 50px; }

            background: white; border: 1px solid #dfe6e9; padding: 10px 20px;

        .page-info { display: flex; align-items: center; font-weight: 800; color: #2d3436; font-size: 15px; }

        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); 
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;

                question: "의사 처방 없이 구할 수 없는 약물을 SNS 등을 통해 구매하는 행동은?", 
                options: ["① 현명한 소비", "② 불법 약물 구매(범죄)", "③ 의료 쇼핑", "④ 직구(직접구매)"], 
                answer: 1 
            },
            { 
                id: 21, 
                cat: "금융교육", 
                title: "보이스피싱 예방", 
                url: "https://www.youtube.com/embed/IBJmlnmGR_E", 
                question: "검찰이나 금융기관을 사칭하며 돈을 이체하라는 전화를 받았다면?", 
                options: ["① 즉시 시키는 대로 이체한다", "② 일단 끊고 해당 기관의 공식 번호로 확인한다", "③ 내 계좌 비밀번호를 알려준다", "④ 무서우니 친구에게 대신 받게 한다"], 
                answer: 1 
            },
            { 
                id: 22, 
                cat: "선거권 교육", 
                title: "공정한 선거 1", 
                url: "https://www.youtube.com/embed/JiraPXPCja0", 
                question: "선거 운동 기간에 후보자에 대한 허위 사실을 유포하는 것은?", 
                options: ["① 표현의 자유", "② 선거법 위반(범죄)", "③ 정당한 비판", "④ 알 권리 충족"], 
                answer: 1 
            },
            { 
                id: 23, 
                cat: "선거권 교육", 
                title: "공정한 선거 2", 
                url: "https://www.youtube.com/embed/pmjazh33m_s", 
                question: "투표소 안에서 하지 말아야 할 행동은?", 
                options: ["① 신분증 제시", "② 기표소 안에서 투표용지 촬영", "③ 조용히 질서 지키기", "④ 선거 사무원의 안내 따르기"], 
                answer: 1 
            },
            { 
                id: 24, 
                cat: "지적재산권 교육", 
                title: "표절 예방", 
                url: "https://www.youtube.com/embed/bCkU22-Vyu0", 
                question: "과제를 할 때 인터넷 자료를 그대로 베껴서 제출하는 행위는?", 
                options: ["① 참고", "② 인용", "③ 표절", "④ 창작"], 
                answer: 2 
            }
        ];

        // ==========================================
        // 2. 페이지네이션 로직 (8개씩 4열 2행)
        // ==========================================
        let currentPage = 1;
        const itemsPerPage = 8; // 한 페이지 8개 (4x2)

        window.changePage = (direction) => {
            const totalPages = Math.ceil(videoData.length / itemsPerPage);
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderVideos();
                window.scrollTo(0, 0); 
            }
        };

        const renderVideos = () => {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = "";
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = videoData.slice(start, end);

            pageData.forEach((vid, index) => {
                let thumbUrl = "https://via.placeholder.com/320x180?text=No+Thumbnail";
                const ytMatch = vid.url.match(/embed\/([^?]+)/);
                if(ytMatch) thumbUrl = `https://img.youtube.com/vi/${ytMatch[1]}/mqdefault.jpg`;

                grid.innerHTML += `
                    <div class="video-card" onclick="openVideoModal(${start + index})">
                        <div class="thumbnail-wrap" style="background-image: url('${thumbUrl}')">
                            <div class="thumbnail-overlay">
                                <div class="play-icon">▶</div>
                            </div>
                        </div>
                        <div class="card-body">
                            <h3 class="video-title">${vid.title}</h3>
                            <div class="video-meta">탭하여 시청 및 퀴즈 풀기</div>
                        </div>
                    </div>
                `;
            });

            const totalPages = Math.ceil(videoData.length / itemsPerPage);
            document.getElementById('pageInfo').innerText = `${currentPage} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        };

        renderVideos();

        // ==========================================
        // 3. 모달 및 인증 로직
        // ==========================================
        window.openVideoModal = (index) => {
            const vid = videoData[index];

            let optionsHtml = vid.options.map((opt, i) => 
                `<label><input type="radio" name="quizAnswer" value="${i}"> <span>${opt}</span></label>`
            ).join('');

            Swal.fire({
                title: `<span style="font-size:18px;">${vid.title}</span>`,
                html: `
                    <div class="modal-video-wrap">
                        <iframe src="${vid.url}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>
                    
                    <div class="quiz-section">
                        <div class="quiz-q">Q. ${vid.question}</div>
                        <div class="quiz-options">${optionsHtml}</div>
                    </div>

                    <div class="auth-section">
                        <div style="font-size:13px; color:#636e72; margin-bottom:8px; font-weight:bold;">수료 확인을 위해 로그인</div>
                        <input id="eduId" placeholder="아이디 (이름+생년월일)">
                        <input id="eduPw" type="password" placeholder="비밀번호">
                    </div>
                `,
                width: 600,
                showConfirmButton: true,
                confirmButtonText: '제출하고 수료하기',
                confirmButtonColor: '#6C5CE7',
                showCloseButton: true,
                customClass: { popup: 'swal-custom-container' },
                preConfirm: async () => {
                    const id = document.getElementById('eduId').value;
                    const pw = document.getElementById('eduPw').value;
                    const selected = document.querySelector('input[name="quizAnswer"]:checked');

                    if (!selected) return Swal.showValidationMessage("퀴즈 정답을 선택해주세요!");
                    if (parseInt(selected.value) !== vid.answer) return Swal.showValidationMessage("오답입니다. 영상을 다시 보고 맞춰보세요!");
                    if (!id || !pw) return Swal.showValidationMessage("아이디와 비밀번호를 입력해주세요.");

                    return { id, pw, vid };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    processSubmission(result.value);
                }
            });
        };

        const processSubmission = async (data) => {
            const rawId = data.id.replace(/\s/g, '');
            const idMatch = rawId.match(/^([가-힣a-zA-Z]+)(\d{6})$/);
            
            if(!idMatch) return Swal.fire('오류', '아이디 형식이 올바르지 않습니다.', 'error');
            const name = idMatch[1];
            const birth = idMatch[2];

            document.getElementById('loadingOverlay').style.display = 'flex';

            try {
                // 1. 유저 인증
                const q = query(collection(db, "users"), where("name", "==", name), where("birth", "==", birth), where("password", "==", data.pw));
                const snapshot = await getDocs(q);

                if(snapshot.empty) {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    return Swal.fire('인증 실패', '회원 정보가 틀립니다.', 'error');
                }

                const userDoc = snapshot.docs[0];
                const userId = userDoc.id;
                const userData = userDoc.data();

                // 2. 중복 수강 체크
                const checkQ = query(
                    collection(db, "education_records"), 
                    where("student_id", "==", userId),
                    where("video_title", "==", data.vid.title)
                );
                const checkSnap = await getDocs(checkQ);

                if(!checkSnap.empty) {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    return Swal.fire({
                        icon: 'warning',
                        title: '이미 수료함',
                        text: '이미 수료한 강의입니다.'
                    });
                }

                // 3. 수강 기록 저장
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

                await addDoc(collection(db, "education_records"), {
                    student_id: userId,
                    student_name: userData.name,
                    student_birth: birth,
                    video_title: data.vid.title,
                    category: data.vid.cat,
                    date: todayStr,
                    timestamp: Timestamp.now()
                });

                document.getElementById('loadingOverlay').style.display = 'none';
                Swal.fire({
                    icon: 'success',
                    title: '수료 완료! 🎉',
                    text: `${userData.name}님, [${data.vid.title}] 교육 수료가 확인되었습니다.`
                });

            } catch(e) {
                console.error(e);
                document.getElementById('loadingOverlay').style.display = 'none';
                Swal.fire('오류', '처리 중 문제가 발생했습니다.', 'error');
            }
        };
    </script>
</body>
</html>
